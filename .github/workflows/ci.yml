name: Flag Service CI Pipeline

on:
  pull_request:
    branches: [ develop, dev, main, master ]

concurrency:
  group: ci-flag-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  # 1. Qualidade de Código & Testes Unitários
  # Executado em todos os Pull Requests
  quality:
    name: Code Quality & Unit Tests
    uses: oseiasal/.github/.github/workflows/reusable-python-quality.yml@main
    with:
      python-version: '3.11'

  # 2. Segurança DevSecOps (SAST Bandit & SCA Trivy)
  # Executado em Pull Requests direcionados para a main/master
  security:
    name: DevSecOps Security Analysis
    needs: quality
    if: github.base_ref == 'main' || github.base_ref == 'master'
    uses: oseiasal/.github/.github/workflows/reusable-security.yml@main
    with:
      language: 'python'
      python-version: '3.11'
      trivy-severity: 'CRITICAL,HIGH'
      fail-on-critical: true
